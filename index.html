<style>:root{--accent:#375797;--bg:#edf3ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#24242b;font:16px/1.65 system-ui,sans-serif}header,main,footer{width:min(100% - 2rem,50rem);margin:auto}header{padding:1.15rem 0;font-weight:800;color:var(--accent);border-bottom:1px solid #24242b24}main{padding:clamp(1.7rem,5vw,3.8rem) 0}h1{font-size:clamp(1.65rem,5.5vw,3.3rem);line-height:1.25;margin:0 0 .65rem;letter-spacing:-.04em}h2{font-size:1.25rem;margin:0 0 .5rem}p{margin:0 0 1rem}.lead{max-width:36rem}.panel{background:#fff;border:1px solid #24242b20;border-radius:1.25rem;padding:clamp(.9rem,4vw,1.6rem);margin-top:1.4rem}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,13rem),1fr));gap:0 1rem}label{display:block;font-weight:650;margin-bottom:.85rem}input:not([type=checkbox]),textarea,select{display:block;width:100%;font:inherit;margin-top:.3rem;padding:.55rem .7rem;border:1px solid #686874;border-radius:.5rem;background:#fff;color:#24242b;min-height:44px}textarea{min-height:8rem;resize:vertical}button{font:inherit;font-weight:700;min-height:44px;padding:.45rem .8rem;border:1px solid var(--accent);border-radius:.55rem;color:var(--accent);background:#fff;cursor:pointer}.primary{background:var(--accent);color:white}button:disabled{opacity:.55;cursor:default}fieldset{border:1px solid #b4b4bd;border-radius:.6rem;margin:0 0 .75rem;padding:.7rem;min-width:0}legend{font-weight:700}.checks{display:flex;flex-wrap:wrap;gap:.25rem .9rem}.checks label{display:inline-flex;align-items:center;gap:.3rem;min-height:34px;margin-bottom:.35rem}input[type=checkbox]{width:1.25rem;height:1.25rem}.actions{display:flex;flex-wrap:wrap;gap:.55rem;margin-top:1rem}output{display:block;white-space:pre-wrap;overflow-wrap:anywhere;border-top:1px solid #24242b24;margin-top:1rem;padding-top:1rem}output:empty{display:none}.guide{margin-top:2rem}footer{border-top:1px solid #24242b24;padding:1rem 0;color:#4c4c56;font-size:.9rem}:focus-visible{outline:3px solid v <body>
<header>シフト概算</header>
<main>
<h1>日付をまたぐバイトの給料概算</h1>
<p class="lead">終了が翌朝のシフトも、休憩と深夜時間を分けて計算できます。</p>
<div class="panel">
<form id="tool">
<div class="fields"><label>開始時刻<input id="start" type="time" value="18:00" required></label><label>終了時刻<input id="end" type="time" value="02:00" required></label><label>基本時給（円）<input id="wage" type="number" value="1200" min="1" max="100000" required></label><label>深夜分の上乗せ率（%）<input id="rate" type="number" value="25" min="0" max="500" step="0.1" required></label><label>休憩の開始時刻<input id="breakStart" type="time" value="21:00"></label><label>休憩時間（分）<input id="breakLength" type="number" value="45" min="0" max="1439" required></label></div>
<div class="actions"><button class="primary" type="submit">シフトの給与を概算</button><button type="button" id="copy" disabled>結果をコピー</button></div>
</form>
<output id="result" aria-live="polite"></output>
<p id="notice" role="status"></p>
</div>
<section class="guide">
<h2>使い方と計算・入力のルール</h2>
<p>深夜帯は22時から翌5時で計算します。時給と上乗せ率は勤務先に合わせて入力してください。結果は1シフト分の概算です。残業手当・交通費・税金などは計算に含みません。</p>
</section>
</main>
<footer>入力内容はブラウザ内で処理し、このページから外部に送信しません。</footer>
<script>
'use strict';
const form = document.querySelector('#tool');
const result = document.querySelector('#result');
const copy = document.querySelector('#copy');
const status = document.querySelector('#notice');
const minutes = value => {
  const [hours, mins] = value.split(':').map(Number);
  return hours * 60 + mins;
};
const overlap = (a, b, c, d) => Math.max(0, Math.min(b, d) - Math.max(a, c));
const lateMinutes = (start, end) => overlap(start, end, 0, 300) + overlap(start, end, 1320, 1740) + overlap(start, end, 2760, 3180);
function calculate() {
  const start = minutes(document.querySelector('#start').value);
  let end = minutes(document.querySelector('#end').value);
  if (start === end) throw Error('開始と終了が同じです。24時間未満の勤務を入力してください。');
  if (end < start) end += 1440;
  const rest = document.querySelector('#breakLength').valueAsNumber;
  const wage = document.querySelector('#wage').valueAsNumber;
  const rate = document.querySelector('#rate').valueAsNumber;
  let late = lateMinutes(start, end);
  if (rest > 0) {
    let restStart = minutes(document.querySelector('#breakStart').value);
    if (restStart < start) restStart += 1440;
    if (!Number.isFinite(restStart) || restStart + rest > end) throw Error('勤務時間内に収まる休憩時刻を入力してください。');
    late -= lateMinutes(restStart, restStart + rest);
  }
  const work = end - start - rest;
  const pay = Math.round(wage * (work + late * rate / 100) / 60);
  const duration = n => Math.floor(n / 60) + '時間' + n % 60 + '分';
  return '概算給与　' + pay.toLocaleString('ja-JP') + '円\n実働　' + duration(work) + '\n深夜帯の実働　' + duration(late);
}

form.addEventListener('submit', event => {
  event.preventDefault();
  try {
    result.textContent = calculate();
    copy.disabled = false;
  } catch (error) {
    result.textContent = error.message;
    copy.disabled = true;
  }
  status.textContent = '';
});
function clearResult() {
  result.textContent = '';
  status.textContent = '';
  copy.disabled = true;
}
form.addEventListener('input', clearResult);
form.addEventListener('click', event => {
  if (event.target.matches('#add, .remove')) clearResult();
});
copy.addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText(result.textContent);
    status.textContent = 'コピーしました。';
  } catch {
    status.textContent = 'コピーできない場合は、結果を選択してコピーしてください。';
  }
});

</script>
</body>
</html>
